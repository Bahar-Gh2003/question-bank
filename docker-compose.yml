services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: questionbank-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ChangeMe_Str0ng!Pass}"
    ports:
      - "1433:1433"
    volumes:
      - questionbank-data:/var/opt/mssql

volumes:
  questionbank-data:
